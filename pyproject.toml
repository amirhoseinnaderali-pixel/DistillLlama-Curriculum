[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cgkd-cr"
version = "0.1.0"
description = "Controlled research framework for curriculum-guided response-level teacher supervision in code reasoning."
requires-python = ">=3.10"
dependencies = ["torch", "transformers", "datasets", "accelerate", "peft", "bitsandbytes", "trl", "unsloth", "pyyaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
